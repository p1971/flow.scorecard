name: flowscorecard_build

on:
  push:
  pull_request:

env:
  BuildConfiguration: Release
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.4.2
        with:
          versionSpec: 6.x

      - name: Determine semantic version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.4.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore src/FlowScorecard.slnx

      - name: Build and analyse
        run: >-
          dotnet build src/FlowScorecard.slnx
          --configuration ${{ env.BuildConfiguration }}
          --no-restore
          -p:Version=${{ steps.gitversion.outputs.AssemblySemVer }}
          -p:AssemblyFileVersion=${{ steps.gitversion.outputs.AssemblySemVer }}
          -p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }}
          -p:AssemblyInformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }}

      - name: Verify formatting
        run: >-
          dotnet format src/FlowScorecard.slnx
          --verify-no-changes
          --no-restore

      - name: Test with coverage
        run: >-
          dotnet test src/FlowScorecard.slnx
          --configuration ${{ env.BuildConfiguration }}
          --no-build
          --logger "trx;LogFileName=TestResults.xml"
          -p:CollectCoverage=true
          -p:CoverletOutput=./TestResults/coverage.opencover.xml
          -p:CoverletOutputFormat=opencover

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Tests
          path: "**/TestResults.xml"
          reporter: dotnet-trx

      - name: Publish coverage
        uses: codecov/codecov-action@v4
        with:
          files: src/FlowScorecard.Engine.UnitTests/TestResults/coverage.opencover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit

      - name: Resolve package version
        id: package-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            version="${{ steps.gitversion.outputs.MajorMinorPatch }}"
          else
            version="${{ steps.gitversion.outputs.FullSemVer }}"
            version="${version%%+*}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Pack
        run: >-
          dotnet pack src/FlowScorecard.Engine/FlowScorecard.Engine.csproj
          --configuration ${{ env.BuildConfiguration }}
          --no-build
          --include-symbols
          --output "${{ runner.temp }}/nuget"
          -p:PackageVersion=${{ steps.package-version.outputs.version }}

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/nuget/*

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: nuget-packages

      - name: Push prerelease packages to GitHub Packages
        if: github.ref != 'refs/heads/main'
        run: >-
          dotnet nuget push "nuget-packages/*.nupkg"
          --source "https://nuget.pkg.github.com/p1971/index.json"
          --skip-duplicate
          --api-key "${{ secrets.GITHUB_TOKEN }}"

      - name: Push release packages to NuGet
        if: github.ref == 'refs/heads/main'
        run: >-
          dotnet nuget push "nuget-packages/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate
          --api-key "${{ secrets.NUGET_API_KEY }}"
